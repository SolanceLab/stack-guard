name: secret-scan
on: [push, pull_request]
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The gitleaks CLI is used because the packaged action needs a licence secret that Dependabot and fork PR runs cannot read.
      - run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
